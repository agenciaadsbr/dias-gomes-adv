<style>
  :root{
    --teal:#00383B;
    --tan:#A9815C;
    --tan-light:#C9A87E;
    --cream:#F1EAE4;
    --ink:#1C2523;
    --grey:#5E6763;
    --line:#E1D6C8;
    --card:#FBF8F4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Manrope', sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }
  .arc{position:absolute; border:1.5px solid rgba(169,129,92,.3); border-radius:50%; pointer-events:none;}
  .arc-a{width:380px; height:380px; top:-160px; right:-140px;}
  .arc-b{width:260px; height:260px; bottom:-140px; left:-100px; border-color:rgba(0,56,59,.14);}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:24px;
    max-width:420px; width:100%; padding:44px 32px 36px; text-align:center;
    position:relative; z-index:1;
    box-shadow:0 30px 60px rgba(0,56,59,.08);
  }
  .mark{width:40px; height:auto; margin:0 auto 22px;}

  .ring-wrap{width:96px; height:96px; margin:0 auto 26px; position:relative;}
  .ring-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
  .ring-bg{fill:none; stroke:var(--line); stroke-width:5;}
  .ring-fg{
    fill:none; stroke:var(--tan); stroke-width:5; stroke-linecap:round;
    stroke-dasharray:264; stroke-dashoffset:264;
    transition:stroke-dashoffset 1s linear;
  }
  .ring-num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Poppins',sans-serif; font-weight:800; font-size:28px; color:var(--teal);
  }

  h1{font-family:'Poppins',sans-serif; font-weight:800; font-size:22px; color:var(--teal); margin-bottom:10px; line-height:1.25;}
  p.sub{font-size:14.5px; color:var(--grey); line-height:1.6; margin-bottom:28px;}
  p.sub b{color:var(--ink);}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:15px 24px; border-radius:100px; font-size:14.5px; font-weight:700;
    font-family:'Manrope',sans-serif; cursor:pointer; border:none;
    background:var(--tan); color:#fff; box-shadow:0 10px 24px rgba(169,129,92,.35);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .btn:hover{background:#94694A; transform:translateY(-2px); box-shadow:0 16px 30px rgba(169,129,92,.42);}
  .wa-icon{width:18px; height:18px; flex-shrink:0;}

  .note{font-size:11.5px; color:#96897c; margin-top:18px; line-height:1.5;}

  @media (prefers-reduced-motion: reduce){
    .ring-fg{transition:none;}
  }
</style>
</head>

  <h1 id="greeting">Perfeito!</h1>
  <p class="sub" id="subtext">Você será direcionado ao WhatsApp do escritório em instantes para continuar sua verificação.</p>
  <a href="#" id="waFallback" class="btn" target="_top" rel="noopener">
    <svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.85.5 3.6 1.44 5.13L2 22l5.13-1.55c1.47.8 3.14 1.25 4.91 1.25 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2z"/></svg>
    Ir para o WhatsApp agora
  </a>
  <p class="note">Se o redirecionamento automático não funcionar, use o botão acima.</p>
</div>

<script>
  const WHATSAPP_NUMBER = '5500000000000';

  const params = new URLSearchParams(window.location.search);
  const nome = (params.get('nome') || '').trim();
  const telefone = (params.get('telefone') || '').trim();
  const primeiroNome = nome ? nome.split(' ')[0] : '';

  const greetingEl = document.getElementById('greeting');
  const subtextEl = document.getElementById('subtext');
  if(primeiroNome){
    greetingEl.textContent = 'Perfeito, ' + primeiroNome + '!';
  }
  if(nome){
    subtextEl.innerHTML = 'Recebemos seus dados. Você será direcionado ao WhatsApp do escritório em instantes para continuar a verificação do seu caso, <b>' + primeiroNome + '</b>.';
  }

  let mensagem = 'Olá! Me chamo ' + (nome || '[nome não informado]') + ' e vim pelo site.';
  mensagem += ' Quero saber se tenho direito ao auxílio-moradia da residência médica.';
  if(telefone){ mensagem += ' Meu telefone para contato: ' + telefone + '.'; }

  const waLink = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(mensagem);
  document.getElementById('waFallback').setAttribute('href', waLink);

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ringFg = document.getElementById('ringFg');
  const ringNum = document.getElementById('ringNum');
  const CIRC = 264;

  let count = 3;
  ringNum.textContent = count;
  if(!prefersReducedMotion){ ringFg.style.strokeDashoffset = CIRC - (CIRC/3)*(3-count); }

  const timer = setInterval(function(){
    count -= 1;
    if(count <= 0){
      clearInterval(timer);
      ringNum.textContent = '0';
      if(!prefersReducedMotion){ ringFg.style.strokeDashoffset = 0; }
      try{ window.top.location.href = waLink; }catch(err){ window.location.href = waLink; }
      return;
    }
    ringNum.textContent = count;
    if(!prefersReducedMotion){ ringFg.style.strokeDashoffset = CIRC - (CIRC/3)*(3-count); }
  }, 1000);
</script>
